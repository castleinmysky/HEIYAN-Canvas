<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑岩 · 本地连接器</title><link rel="stylesheet" href="/setup.css"><script src="/setup.js" defer></script></head>
<body><main><header><span class="mark" aria-hidden="true">H</span><div><strong>黑岩连接器</strong><small>HEIYAN · 本机运行</small></div><span id="badge" role="status">检查中</span></header>
<h1>连接你的创作助手</h1><p>无需安装环境、输入命令或注册画布账号。连接器只在这台电脑运行。</p>
<section><div class="step">1</div><div><h2>登录自己的 Codex</h2><p id="login-state">正在检查登录状态…</p><button id="login" disabled>在官方页面登录</button></div></section>
<section><div class="step">2</div><div><h2>连接黑岩画布</h2><p id="connect-state">登录后打开画布，确认配对即可。地址和配对码会自动填好。</p><button id="connect" class="primary" disabled>打开画布并配对 <span aria-hidden="true">→</span></button></div></section>
<p id="error" role="alert"></p><footer><span>不读取密码 · 不启动生成 · 不修改系统环境</span><button id="stop">停止连接器</button></footer><p class="note">关闭本页不会停止连接器；需要结束时点击“停止连接器”，或双击包内的停止脚本。手机跨机连接尚未开放。</p></main></body></html>
